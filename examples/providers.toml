# 完全虚构的示例，不包含真实密钥。本文件默认选择离线 Mock。
# 配置不授予联网、数据共享或 HTTP 使用权限，运行时必须另行确认。
[llm]
provider = "offline"
adapter = "mock"

[llm.providers.offline]
model = "mock-model"

[llm.providers.responses_example]
adapter = "openai_responses"
base_url = "https://api.openai.com/v1"
model = "replace-with-confirmed-model"
api_key_env = "WOA_LLM_API_KEY"
timeout = 30
max_output_tokens = 4000

[llm.providers.responses_example.capabilities]
text_input = true
responses_api = true
structured_output = true

[llm.providers.compatible_example]
adapter = "openai_chat_completions"
base_url = "https://api.example.com/v1"
model = "example-model"
api_key_env = "EXAMPLE_MODEL_KEY"
timeout = 30
max_output_tokens = 4000

[llm.providers.compatible_example.capabilities]
text_input = true
chat_completions_api = true
json_mode = true

[llm.providers.compatible_example.extra_params]
temperature = 0.2
